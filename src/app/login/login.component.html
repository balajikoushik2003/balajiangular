<div class="login-container">
  <h2>Login</h2>
  <div class="image-container">
    <img src="assets/images/s1.jpeg" alt="School logo" class="logo" />
  </div>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        id="email"
        formControlName="email"
        type="email"
        class="form-control"
        placeholder="Enter your email"
      />
      <div
        *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        class="error"
      >
        <div *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required!
        </div>
        <div *ngIf="loginForm.get('email')?.hasError('email')">
          Invalid email address!
        </div>
      </div>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="form-control"
        placeholder="Enter your password"
      />
      <div
        *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        class="error"
      >
        <div *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required!
        </div>
      </div>
    </div>
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
    <div class="button-group">
      <button
        type="submit"
        class="btn btn-primary"
      >
        Login
      </button>
      <button
        type="button"
        (click)="navigateToRegister()"
        class="btn btn-secondary"
      >
        Register
      </button>
    </div>
  </form>

  <div *ngIf="isLoading" class="spinner">
    Please keep patience✋🏻..........
  </div>
</div>
